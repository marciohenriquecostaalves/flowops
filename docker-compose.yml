services:
  postgres:
    image: postgres:17-alpine
    container_name: flowops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
      POSTGRES_DB: flowops
    ports:
      - "5432:5432"
    volumes:
      - flowops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: flowops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flowops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowops-postgres:
  flowops-redis:
